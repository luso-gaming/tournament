<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 | Luso Esports</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/404.css">
</head>

<body>

    <!-- Background Glow -->
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <!-- Grid -->
    <div class="grid-overlay"></div>

    <!-- Floating Elements -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

    <main class="container">

        <div class="logo-text">
            LUSO <span>ESPORTS</span>
        </div>

        <h1 class="error-code">
            404
        </h1>

        <h2 class="title">
            MATCH NOT FOUND
        </h2>

        <p class="description">
            The arena you are trying to enter does not exist,
            has been moved, or is currently unavailable.
        </p>

        <div class="buttons">

            <a href="/" class="btn primary-btn">
                RETURN HOME
            </a>

            <button class="btn secondary-btn" onclick="history.back()">
                GO BACK
            </button>

        </div>

    </main>

</body>
</html>
