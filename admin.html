<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Admin Panel – Luso Esports</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <h1>Admin Panel</h1>

  <div id="adminInfo"></div>

  <section class="card">
    <h2>Users</h2>
    <div id="usersList">Loading...</div>
  </section>

  <button id="logoutBtn">Logout</button>

  <h2>Create Tournament</h2>

<form id="createTournament">
  <input type="text" placeholder="Tournament Title" id="title" required />
  <textarea placeholder="Description" id="desc"></textarea>

  <select id="type">
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
    <option value="seasonal">Seasonal</option>
  </select>

  <select id="status">
    <option value="upcoming">Upcoming</option>
    <option value="live">Live</option>
    <option value="completed">Completed</option>
  </select>

  <button type="submit">Create Tournament</button>
</form>

<hr>

<h2>Existing Tournaments</h2>
<div id="tournamentList">Loading...</div>


  <script type="module" src="js/admin.js"></script>
</body>
</html>
