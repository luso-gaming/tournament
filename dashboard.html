<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Dashboard | Luso Esports</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Common CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<button id="backBtn" class="back-btn">⬅ Back</button>
  <main class="dashboard">
    <div class="dashboard-card">
      <h1>My Dashboard</h1>

      <div class="user-info">
        <p><strong>Name:</strong></p>
        <div class="fill"><span id="userName">Loading...</span></div>
      
        <p><strong>Email:</strong></p>
        <div class="fill"><span id="userEmail">Loading...</span></div>
      
        <p><strong>Team Name:</strong></p>
        <div class="fill">
          <span id="userTeam">Loading...</span>
          <input type="text" id="teamInput" class="hidden" />
        </div>
      
        <p><strong>In Game Name:</strong></p>
        <div class="fill">
          <span id="userIgn">Loading...</span>
          <input type="text" id="ignInput" class="hidden" />
        </div>
      
        <button id="editProfileBtn" class="update-btn">Update</button>
      </div>

      <hr>

      <div class="user-points">
        💰 Points: <strong id="userPoints">0</strong>
      </div>

      <hr>

      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </main>

  <!-- JS -->
  <script type="module" src="js/dashboard.js"></script>

</body>
</html>
