<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth Redirect</title>
</head>
<body>

  <p>Signing you in…</p>

  <script type="module">
    import { supabase } from "./supabase.js";

    const { data } = await supabase.auth.getSession();

    if (data.session) {
      // login success
      window.location.href = "/index.html";
    }
  </script>

</body>
</html>
