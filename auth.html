<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth Redirect</title>
  <link rel="stylesheet" href="css/auth.css">

</head>
<body>

  <div class="auth-loader">

    <!-- Navbar Skeleton -->
    <div class="nav-skeleton skeleton"></div>

    <!-- Profile Section -->
    <div class="profile-skeleton">
      <div class="avatar skeleton"></div>
      <div class="info">
        <div class="line skeleton"></div>
        <div class="line small skeleton"></div>
      </div>
    </div>

    <!-- Cards Section -->
    <div class="cards">
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </div>

  </div>


  <script type="module">
  import { supabase } from "/js/supabase.js";

  async function handleAuthRedirect() {

    const {
      data: { session },
      error
    } = await supabase.auth.getSession();

    // ❌ NOT LOGGED IN
    if (error || !session) {
      window.location.href = "/login.html";
      return;
    }

    const user = session.user;

    // 🔍 CHECK PROFILE
    let {
      data: profile,
      error: profileError
    } = await supabase
      .from("profiles")
      .select(`
        id,
        status,
        team_name,
        in_game_name
      `)
      .eq("id", user.id)
      .maybeSingle();

    // 🆕 CREATE PROFILE IF NOT EXISTS
    if (!profile) {

      const { error: insertError } = await supabase
        .from("profiles")
        .insert({
          id: user.id,
          email: user.email,
          status: "active"
        });

      if (insertError) {
        console.error(insertError);
        alert("Error creating profile");
        return;
      }

      // TEMP PROFILE OBJECT
      profile = {
        status: "active",
        team_name: null,
        in_game_name: null
      };
    }

    // 🚫 ACCOUNT STATUS CHECK
    if (profile.status !== "active") {

      alert("Your account is suspended or deactivated.");

      await supabase.auth.signOut();

      window.location.href = "/login.html";
      return;
    }

    // 🧾 CHECK PROFILE COMPLETION
    const hasTeam =
      profile.team_name &&
      profile.team_name.trim() !== "";

    const hasIgn =
      profile.in_game_name &&
      profile.in_game_name.trim() !== "";

    // 👤 NEW USER
    if (!hasTeam || !hasIgn) {
      window.location.href = "/complete-profile.html";
      return;
    }

    // ✅ EXISTING USER
    window.location.href = "/index.html";
  }

  handleAuthRedirect();
</script>

</body>
</html>
