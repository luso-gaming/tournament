<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Teams & Leaderboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="teams.css">
</head>
<body>

    <!-- NAVBAR -->
    <div id="sidebar-container"></div> 

    <!-- REGISTERED TEAMS -->
    <section class="teams-section">
        <h1>Registered Teams</h1>

        <div class="teams-grid">

            <div class="team-card">
                <img src="logos/team1.png" alt="Team Alpha">
                <h3>Team Alpha</h3>
            </div>

            <div class="team-card">
                <img src="logos/team2.png" alt="Team Blaze">
                <h3>Team Blaze</h3>
            </div>

            <div class="team-card">
                <img src="logos/team3.png" alt="Team Phantom">
                <h3>Team Phantom</h3>
            </div>

            <div class="team-card">
                <img src="logos/team4.png" alt="Team Vortex">
                <h3>Team Vortex</h3>
            </div>

        </div>
    </section>

    <!-- LEADERBOARD -->
    <section class="leaderboard-section">
        <h2>Leaderboard</h2>

        <div class="leaderboard">
            <div class="leaderboard-row header">
                <span>Rank</span>
                <span>Team</span>
                <span>Points</span>
            </div>

            <div class="leaderboard-row">
                <span>🥇 1</span>
                <span>Team Alpha</span>
                <span>120</span>
            </div>

            <div class="leaderboard-row">
                <span>🥈 2</span>
                <span>Team Blaze</span>
                <span>105</span>
            </div>

            <div class="leaderboard-row">
                <span>🥉 3</span>
                <span>Team Phantom</span>
                <span>92</span>
            </div>

            <div class="leaderboard-row">
                <span>4</span>
                <span>Team Vortex</span>
                <span>80</span>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        © 2026 Luso Esports. All Rights Reserved.
    </footer>
<link rel="stylesheet" href="sidebar.css">
<script src="sidebar.js"></script>
<script src="sidebar-loader.js"></script>
</body>
</html>
