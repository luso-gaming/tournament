<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complete Profile | Luso Esports</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/complete-profile.css">
</head>
<body>

<div class="card">
  <h1>Complete Your Profile</h1>

  <input type="text" id="teamName" placeholder="Team Name">
  <input type="text" id="ign" placeholder="In Game Name">

  <div class="consent-section">
  
    <label class="consent-item">
      <input type="checkbox" id="ageConfirm">
      <span>I confirm that I am 18 years of age or older.</span>
    </label>
  
    <label class="consent-item">
      <input type="checkbox" id="termsPrivacy">
      <span>
        I agree to
        <a href="/terms.html" target="_blank">Terms & Conditions</a>
        and
        <a href="/privacy-policy.html" target="_blank">Privacy Policy</a>.
      </span>
    </label>
  
  </div>

      <button id="saveBtn" tabindex="0">
      
        <span class="btn-default">SUBMIT</span>
      
        <span class="btn-success">
          <svg xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#0e418f"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round">
      
            <path d="M20 6L9 17l-5-5"/>
          </svg>
      
          Saved
        </span>
      
        <span class="btn-loading">
          SAVING...
        </span>
      
        <span class="btn-error">
          ERROR
        </span>
      
        <span class="btn-retry">
          TRY AGAIN
        </span>
      
      </button>
      <div>
        <div class="description" id="formMessage">
          <p></p>
        </div>
      </div>
  
</div>
<!-- -->
<script type="module" src="/js/complete-profile.js"></script> 

</body>
</html>
