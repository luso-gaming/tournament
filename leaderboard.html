<body>

    <div id="sidebar-container"></div>

    <main class="lb-main">

        <!-- HERO -->
        <section class="lb-hero">
            <div class="lb-hero-bg">RANK</div>
            <div class="lb-hero-inner">
                <div class="lb-eyebrow">
                    <span class="eyebrow-dot"></span>
                    Live Rankings
                </div>
                <h1 class="lb-title">Leaderboard</h1>

                <!-- INFO BOX (season info / weekly timer) -->
                <div class="lb-info-box" id="infoBox">
                    <p id="infoText">Loading...</p>
                </div>
            </div>
        </section>

        <section class="lb-body">

            <!-- ── CONTROLS ROW ── -->
            <div class="lb-controls">

                <!-- Season / Weekly toggle -->
                <div class="lb-toggle" id="leaderboardToggle">
                    <div class="toggle-slider"></div>
                    <button class="active" data-mode="season">Season</button>
                    <button data-mode="weekly">Weekly</button>
                </div>

                <!-- Type filter chips -->
                <div class="lb-filters" id="typeFilters">
                    <button class="filter-chip active" data-type="all">All</button>
                    <button class="filter-chip" data-type="elite">
                        <span class="chip-dot elite-dot"></span>Elite
                    </button>
                    <button class="filter-chip" data-type="pro">
                        <span class="chip-dot pro-dot"></span>Pro
                    </button>
                    <button class="filter-chip" data-type="legend">
                        <span class="chip-dot legend-dot"></span>Legend
                    </button>
                </div>

            </div>

            <!-- ── TITLE ── -->
            <div class="lb-title-row">
                <div class="lb-section-label">
                    <span class="label-dot"></span>
                    <span id="leaderboardTitle">Season Leaderboard</span>
                </div>
                <div class="lb-count" id="lbCount"></div>
            </div>

            <!-- ── SEARCH ── -->
            <div class="lb-search-wrap">
                <div class="lb-search">
                    <span class="search-icon">⌕</span>
                    <input
                        type="text"
                        id="leaderboardSearch"
                        placeholder="Search team name..."
                        onkeyup="searchLeaderboard()"
                        autocomplete="off"
                    />
                </div>
            </div>

            <!-- ── TABLE HEADER ── -->
            <div class="lb-table-head">
                <span class="col-rank">Rank</span>
                <span class="col-team">Team</span>
                <span class="col-kills">Kills</span>
                <span class="col-pts">Points</span>
            </div>

            <!-- ── ROWS ── -->
            <div class="leaderboard" id="leaderboardContainer"></div>

            <!-- ── YOUR RANK ── -->
            <div class="user-rank-box" id="userRankBox">
                <div class="user-rank-label">Your Rank</div>
                <div class="user-rank-value" id="userRankText">Loading...</div>
            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="lb-footer">
        <div class="footer-links">
            <a href="/about.html">About Us</a>
            <span>|</span>
            <a href="/privacy-policy.html">Privacy Policy</a>
            <span>|</span>
            <a href="/terms.html">Terms &amp; Conditions</a>
            <span>|</span>
            <a href="/contact.html">Contact</a>
        </div>
        <p class="footer-copy">© 2026 Luso Esports. All rights reserved.</p>
    </footer>

    <script type="module" src="/js/auth-ui.js"></script>
</body>
</html>
